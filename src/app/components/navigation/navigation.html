<nav class="header_navigation_options" aria-label="Main navigation">
  <div class="header_navigation_links">
    <a
      href="#"
      (click)="onCurrentRouteChange.emit('dashboard')"
      [class.header_navigation_option--active]="currentRoute === 'dashboard'"
      class="header_navigation_option header_navigation_option_dashboard"
      aria-current="page"
      ><img src="icons/dashboard.svg" alt="" />Dashboard</a
    >
    <a
      href="#"
      (click)="onCurrentRouteChange.emit('my-cards')"
      [class.header_navigation_option--active]="currentRoute === 'my-cards'"
      class="header_navigation_option header_navigation_option_mycards"
      ><img src="icons/card.svg" alt="" />My Cards</a
    >
    <a
      href="#"
      (click)="onCurrentRouteChange.emit('transactions')"
      [class.header_navigation_option--active]="currentRoute === 'transactions'"
      class="header_navigation_option header_navigation_option_transactions"
      ><img src="icons/transactions.svg" alt="" />Transactions</a
    >
  </div>
  <div class="header_account_button">
    <button>My space</button>
  </div>
</nav>
