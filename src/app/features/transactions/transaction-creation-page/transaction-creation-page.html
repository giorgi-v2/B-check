<form class="transaction-form" aria-labelledby="transaction-form-title">
  <header class="transaction-form-header">
    <span class="transaction-form-icon" aria-hidden="true">
      <i class="fa-solid fa-arrow-right-arrow-left"></i>
    </span>
    <div>
      <h1 id="transaction-form-title">Add transaction</h1>
      <p>Keep your payments and transfers in one place.</p>
    </div>
  </header>

  <fieldset class="transaction-form-fields" aria-label="Transaction details">
    <fieldset class="form-choice-group form-field-wide" aria-label="Transaction type">
      <div class="type-options">
        <label class="choice-tile type-tile">
          <input
            class="choice-input"
            type="radio"
            name="type"
            value="income"
            [(ngModel)]="type"
            required
          />
          <i class="fa-solid fa-arrow-down" aria-hidden="true"></i>
          <span>Income</span>
        </label>
        <label class="choice-tile type-tile">
          <input
            class="choice-input"
            type="radio"
            name="type"
            value="outcome"
            [(ngModel)]="type"
            required
          />
          <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
          <span>Outcome</span>
        </label>
      </div>
    </fieldset>

    <div class="form-field form-field-wide">
      <label for="amount">Amount</label>
      <div class="amount-group">
        <input
          type="number"
          name="amount"
          id="amount"
          [(ngModel)]="amount"
          min="0.01"
          step="0.01"
          inputmode="decimal"
          placeholder="0.00"
          required
        />
        <div class="amount-currency" role="radiogroup" aria-label="Currency">
          <label class="choice-tile currency-tile">
            <input
              class="choice-input"
              type="radio"
              name="currency"
              value="GEL"
              [(ngModel)]="currency"
              required
            />
            <span>GEL</span>
          </label>
          <label class="choice-tile currency-tile">
            <input
              class="choice-input"
              type="radio"
              name="currency"
              value="USD"
              [(ngModel)]="currency"
              required
            />
            <span>USD</span>
          </label>
          <label class="choice-tile currency-tile">
            <input
              class="choice-input"
              type="radio"
              name="currency"
              value="EUR"
              [(ngModel)]="currency"
              required
            />
            <span>EUR</span>
          </label>
        </div>
      </div>
    </div>

    <div class="form-field">
      <label for="date">Date and time</label>
      <input type="datetime-local" name="date" id="date" ngModel required />
    </div>

    <div class="form-field">
      <label for="place">Place <span class="form-optional">(optional)</span></label>
      <input
        type="text"
        name="place"
        id="place"
        [(ngModel)]="place"
        placeholder="e.g. Spar or Bolt"
      />
    </div>

    <fieldset class="form-choice-group form-field-wide">
      <legend>Category <span class="form-optional">(optional)</span></legend>
      <div class="category-options">
        <label class="choice-tile category-tile">
          <input
            class="choice-input"
            type="radio"
            name="category"
            value="products"
            [(ngModel)]="category"
          />
          <i class="fa-solid fa-basket-shopping" aria-hidden="true"></i>
          <span>Products</span>
        </label>
        <label class="choice-tile category-tile">
          <input
            class="choice-input"
            type="radio"
            name="category"
            value="health"
            [(ngModel)]="category"
          />
          <i class="fa-solid fa-heart-pulse" aria-hidden="true"></i>
          <span>Health</span>
        </label>
        <label class="choice-tile category-tile">
          <input
            class="choice-input"
            type="radio"
            name="category"
            value="transport"
            [(ngModel)]="category"
          />
          <i class="fa-solid fa-car" aria-hidden="true"></i>
          <span>Transport</span>
        </label>
        <label class="choice-tile category-tile">
          <input
            class="choice-input"
            type="radio"
            name="category"
            value="salary"
            [(ngModel)]="category"
          />
          <i class="fa-solid fa-wallet" aria-hidden="true"></i>
          <span>Salary</span>
        </label>
        <label class="choice-tile category-tile">
          <input
            class="choice-input"
            type="radio"
            name="category"
            value="transfer"
            [(ngModel)]="category"
          />
          <i class="fa-solid fa-arrow-right-arrow-left" aria-hidden="true"></i>
          <span>Transfer</span>
        </label>
      </div>
    </fieldset>
  </fieldset>

  <fieldset class="transaction-form-fields transaction-form-card">
    <legend>Cards</legend>
    <div class="form-card-previews form-field-wide" role="list" aria-label="Available cards">
      @for (card of cards(); track card.id) {
        <app-card-box
          [card]="card"
          role="listitem"
          [selected]="card.id === cardId()"
          (onClick)="cardId.set(card.id)"
        ></app-card-box>
      } @empty {
        <p class="form-hint">No cards available.</p>
      }
    </div>
  </fieldset>

  <footer class="transaction-form-actions">
    <button class="form-button form-button-secondary" type="reset">Clear form</button>
    <button class="form-button form-button-primary" type="submit" (click)="createTransaction()">
      <i class="fa-solid fa-plus" aria-hidden="true"></i>
      Add transaction
    </button>
  </footer>
</form>
