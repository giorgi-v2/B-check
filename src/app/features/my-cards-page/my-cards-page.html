<section class="my-cards" aria-labelledby="my-cards-title">
  <div class="my-cards-heading">
    <h1 id="my-cards-title" class="my-cards-title">My cards</h1>
    <p class="my-cards-description">Your cards, balances and account details in one place.</p>
  </div>
  <button class="my-cards-add" type="button">+ Add a card</button>

  @let _card = selectedCard();

  <div class="my-cards-list">
    @for (card of cards(); track card.id) {
      <app-card-box
        [card]="card"
        [selected]="card.id === _card?.id"
        (onClick)="selectedCardId.set(card.id)"
      ></app-card-box>
    }
  </div>
  @if (_card) {
    <div class="my-cards-accounts" role="list" [attr.aria-label]="_card.name + ' accounts'">
      @for (account of _card.accounts; track $index) {
        <app-card-account-box [account]="account" role="listitem"></app-card-account-box>
      } @empty {
        <p class="my-cards-empty">No accounts available for this card.</p>
      }
    </div>
  }
</section>
