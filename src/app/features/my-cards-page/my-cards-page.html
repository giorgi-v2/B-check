<section>
  <div>
    <h1>My cards</h1>
    <p>Your cards, balances and account details in one place.</p>
  </div>
  <button>+ Add a card</button>

  <div>
    <div>
      <i class="fa-jelly fa-regular fa-credit-card"></i>
      <span>
        @for (card of cards(); track card.id) {
          <app-card-box [card]="card"></app-card-box>
        }
      </span>
    </div>
  </div>
</section>
