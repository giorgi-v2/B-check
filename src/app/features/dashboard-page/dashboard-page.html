<section class="content" aria-labelledby="dashboard-title">
  <div class="content_container">
    <div class="content_container_header">
      <h1 id="dashboard-title" class="content_container_title">Your money, at a glance.</h1>
      <p class="content_container_description">A little clarity for every financial decision.</p>
    </div>
    <div class="content_period" aria-label="Reporting period">
      <svg class="content_icon" aria-hidden="true" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="5" width="18" height="16" rx="3" />
        <path d="M7 3v4m10-4v4M3 10h18" />
      </svg>
      <span>October 2026</span>
      <svg class="content_period_chevron" aria-hidden="true" viewBox="0 0 24 24" fill="none">
        <path d="m6 9 6 6 6-6" />
      </svg>
    </div>
  </div>
  <app-card-balance></app-card-balance>
  <app-box>
    <app-transactions-table [transactions]="last4Transactions()"></app-transactions-table>
  </app-box>
</section>
