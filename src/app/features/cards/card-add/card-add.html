<form (ngSubmit)="submitCard()">
  <label for="cardName">Enter card name</label>
  <input type="text" id="cardName" name="cardName" [(ngModel)]="cardName" ] />
  <label for="cardnumber">Enter card number</label>
  <input type="text" id="cardnumber" name="cardnumber" [(ngModel)]="cardNumber" ] />
  <label for="cardcvv">Enter card security number</label>
  <input type="text" id="cardcvv" name="cardcvv" [(ngModel)]="cardCvv" ] />
  <label for="cardExpirationDate">Enter card expiration date</label>
  <input
    type="month"
    id="cardExpirationDate"
    name="cardExpirationDate"
    [(ngModel)]="cardExpirationDate"
    ]
  />
  <label for="cardBalance">Enter card balance</label>
  <input
    type="number"
    id="cardBalance"
    name="cardBalance"
    [(ngModel)]="cardBalance"
    ]
    min="0"
    step="0.01"
  />
  <label for="cardCurrency">Currency</label>
  <select id="cardCurrency" name="cardCurrency" [(ngModel)]="cardCurrency">
    <option value="GEL">GEL</option>
    <option value="USD">USD</option>
    <option value="EUR">EUR</option>
  </select>
  <button type="submit">Add card</button>
</form>
