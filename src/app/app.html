<app-header
  [currentRoute]="currentRoute()"
  (onCurrentRouteChange)="handleCurrentRouteChange($event)"
></app-header>
<main class="app-main">
  @switch (currentRoute()) {
    @case ('dashboard') {
      <app-dashboard-page></app-dashboard-page>
    }
    @case ('my-cards') {
      <app-my-cards-page [cards]="cards()"> </app-my-cards-page>
    }
    @case ('transactions') {
      <app-transactions-page
        [transactions]="transactions()"
        (onAddTransaction)="handleCurrentRouteChange('transaction-creation')"
      ></app-transactions-page>
    }
    @case ('transaction-creation') {
      <app-transaction-creation-page></app-transaction-creation-page>
    }
  }
</main>
<app-footer></app-footer>
