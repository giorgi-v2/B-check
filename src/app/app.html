<app-header
  [currentRoute]="currentRoute()"
  (onCurrentRouteChange)="handleCurrentRouteChange($event)"
></app-header>
<main class="app-main">
  @switch (currentRoute()) {
    @case ('dashboard') {
      <app-dashboard-page></app-dashboard-page>
    }
    @case ('my-cards') {
      <app-my-cards-page></app-my-cards-page>
    }
    @case ('transactions') {
      <app-transactions-page></app-transactions-page>
    }
  }
</main>
<app-footer></app-footer>
